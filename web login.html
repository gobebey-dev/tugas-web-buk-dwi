<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: #111;
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.3),
                        0 0 15px rgba(255, 215, 0, 0.15);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #ffd700;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #4da6ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #1a1a1a;
            border: 1.5px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .form-group input:focus {
            border-color: #4da6ff;
            box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(90deg, #e63946, #c1121f);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .extra {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
        }

        .extra a {
            color: #4da6ff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .extra a:hover {
            color: #ffd700;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 22px 0;
            color: #444;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider span {
            padding: 0 12px;
        }

        .footer-text {
            text-align: center;
            margin-top: 28px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>LOGIN</h1>
            <p>Masuk ke akun Anda</p>
        </div>

        <form>
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Masukkan username atau email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <div class="divider">
            <span>atau</span>
        </div>

        <div class="extra">
            <a href="#">Lupa password?</a> &nbsp;·&nbsp; <a href="#">Daftar akun baru</a>
        </div>

        <p class="footer-text">© 2026 Simple Login</p>
    </div>
</body>
</html>
